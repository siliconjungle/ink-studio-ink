[package]
name = "ink-studio-wgpu"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ink-gpu-program = { path = "../build/gpu/native" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
wgpu = "=30.0.1"

[dev-dependencies]
pollster = "0.4"
