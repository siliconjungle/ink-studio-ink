<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Ink Studio WebGPU check</title></head>
<body>
<canvas width="64" height="64"></canvas>
<pre id="status" role="status">Running WebGPU check</pre>
<script type="module">
  import { createGaussianRenderer } from '../web/gaussian.mjs';
  import { loadInk } from '../build/frost-gpu/ink-gpu.mjs';
  import { loadInk as loadGaussian } from '../build/gpu/ink-gpu.mjs';

  const status = document.getElementById('status');
  async function check() {
    const adapter = await navigator.gpu?.requestAdapter();
    if (!adapter) throw new Error('Browser WebGPU adapter unavailable');
    const device = await adapter.requestDevice();
    device.pushErrorScope('validation');
    const canvas = document.querySelector('canvas');
    const context = canvas.getContext('webgpu');
    const format = navigator.gpu.getPreferredCanvasFormat();
    context.configure({ device, format, alphaMode: 'opaque',
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
    const near = { position: [0, 0, -2], covariance0: [16, 0, 0], covariance1: [16, 0, 0],
      reach: 3, rgb: 255, alpha: 0.8 };
    const rows = [near, { ...near, position: [0, 0, -3], rgb: 65280 }];
    const camera = { eye: [0, 0, 0], right: [1, 0, 0], up: [0, 1, 0], back: [0, 0, 1],
      focal: 1, near_clip: 0.1, far_clip: 10, variance: 0, perspective: false };
    const readback = device.createBuffer({ size: 64 * 64 * 4, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const reference = new Map();
    for (const preordered of [false, true]) {
      const splats = preordered ? rows.toReversed() : rows;
      const renderer = await createGaussianRenderer(device, format, { width: 64, height: 64, splats, camera, preordered });
      for (const [litX, darkX] of [[32, 54], [54, 32]]) {
        const counters = litX === 32 ? renderer.initialCounters : await renderer.updateCamera({ ...camera, eye: [-22, 0, 0] });
        const expectedDispatch = preordered ? counters.dispatches === 1 : counters.dispatches > 1;
        if (!expectedDispatch || (counters.readback_bytes ?? 0) !== 0) {
          throw new Error(`Unexpected GPU counters ${JSON.stringify(counters)}`);
        }
        const target = context.getCurrentTexture();
        const encoder = device.createCommandEncoder();
        renderer.draw(encoder, target.createView());
        encoder.copyTextureToBuffer({ texture: target }, { buffer: readback, bytesPerRow: 256 }, [64, 64]);
        device.queue.submit([encoder.finish()]);
        await readback.mapAsync(GPUMapMode.READ);
        const data = new Uint8Array(readback.getMappedRange());
        const channel = format.startsWith('bgra') ? 2 : 0;
        if (data[32 * 256 + litX * 4 + channel] <= 170 || data[32 * 256 + litX * 4 + 1] >= 60 ||
            data.slice(32 * 256 + darkX * 4, 32 * 256 + darkX * 4 + 3).some(Boolean)) {
          throw new Error('Gaussian render did not match expected pixels');
        }
        if (preordered && data.some((value, i) => value !== reference.get(litX)[i])) {
          throw new Error('Sorted and preordered frames differ');
        }
        if (!preordered) reference.set(litX, data.slice());
        readback.unmap();
      }
      await renderer.updateCamera({ ...camera, eye: [500, 0, 0] });
      const target = context.getCurrentTexture();
      const encoder = device.createCommandEncoder();
      renderer.draw(encoder, target.createView());
      encoder.copyTextureToBuffer({ texture: target }, { buffer: readback, bytesPerRow: 256 }, [64, 64]);
      device.queue.submit([encoder.finish()]);
      await readback.mapAsync(GPUMapMode.READ);
      const blank = new Uint8Array(readback.getMappedRange());
      if (blank.some((value, i) => i % 4 === 3 ? value !== 255 : value !== 0)) {
        throw new Error('Culled geometry survived a zero-instance draw');
      }
      readback.unmap();
      await renderer.close();
    }
    const contour = await createGaussianRenderer(device, format, { width: 64, height: 64, camera,
      splats: [{ ...near, position: [0.25, 0.25, -2], covariance0: [4, 0, 0], covariance1: [4, 0, 0], alpha: 1 }],
      contours: { colors: [0x101820, 0xff0000], depthSpan: 10, dither: 0 } });
    const contourTarget = context.getCurrentTexture();
    const encoder = device.createCommandEncoder();
    contour.draw(encoder, contourTarget.createView());
    encoder.copyTextureToBuffer({ texture: contourTarget }, { buffer: readback, bytesPerRow: 256 }, [64, 64]);
    device.queue.submit([encoder.finish()]);
    await readback.mapAsync(GPUMapMode.READ);
    const colors = new Uint8Array(readback.getMappedRange());
    const red = format.startsWith('bgra') ? 2 : 0;
    if (colors[red] !== 16 || colors[31 * 256 + 32 * 4 + red] !== 255 ||
        !colors.some((value, i) => i % 4 === red && value > 16 && value < 255)) {
      throw new Error('Colored Contours missed the background, interior, or silhouette');
    }
    readback.unmap();
    await contour.close();
    readback.destroy();
    const bone = { axis_x: [1, 0, 0], axis_y: [0, 1, 0], axis_z: [0, 0, 1], offset: [0, 0, 0] };
    const light = { sun: [0, 1, 0], ambient: 1, diffuse: 0, blink: 1 };
    const rest = [{ center: [0, 0, -2], covariance0: [1, 0, 0], covariance1: [1, 0, 1],
      normal: [0, 1, 0], joints: [1, 1], weight: 0, shade: 0, palette: [255, 0, 0, 0],
      tones: 1, eye: false, alpha: 1 }];
    const bones = [bone, bone, bone];
    const changed = [bone, { ...bone, offset: [4, 0, 0] }, bone];
    const signedZero = [bone, { ...bone, offset: [4, -0, 0] }, bone];
    const rigRenderer = await createGaussianRenderer(device, format, { width: 64, height: 64,
      splats: [], camera, skin: { rest, bones, light } });
    for (const [pose, expected] of [[bones, 4 + 3 * 48 + 24], [changed, 48 + 24], [signedZero, 48 + 24], [signedZero, 24]]) {
      const { rigUploadBytes } = await rigRenderer.updateSkinCamera(camera, { bones: pose, light });
      if (rigUploadBytes !== expected) throw new Error(`Wrong rig upload count ${rigUploadBytes}, expected ${expected}`);
    }
    await rigRenderer.close();

    const runtime = await loadGaussian(new URL('../build/gpu/', import.meta.url), { device });
    const session = await runtime.open({
      inputs: { rest, bones, light },
      steps: [{ id: 'posed', call: 'skin_world', args: [{ input: 'rest' }, { input: 'bones' }, { input: 'light' }] }],
      outputs: ['posed'],
    }, { backend: 'gpu-required' });
    const checkUpload = async bytes => {
      if ((await session.writeChanged('bones', changed)).counters.upload_bytes !== bytes) throw new Error('Wrong changed transform span');
    };
    await checkUpload(4 + 3 * 48);
    await checkUpload(0);
    await session.writeRanges('bones', [{ start: 1, values: [bone] }]);
    await checkUpload(4 + 3 * 48);
    await session.write('bones', bones);
    await checkUpload(4 + 3 * 48);
    await session.step();
    const posed = (await session.read({ outputs: ['posed'] })).values.posed;
    if (posed[0].position.join() !== '4,0,-2') throw new Error('Patched transform did not reach skinned splat');

    const splats = rows.slice(0, 1);
    const target = await runtime.open({
      inputs: { splats, camera: { ...camera, half_viewport: [32, 32] } },
      steps: [{ id: 'ellipses', call: 'project_world', args: [{ input: 'splats' }, { input: 'camera' }] }],
      outputs: ['ellipses'],
    }, { backend: 'gpu-required' });
    await target.writeChanged('splats', splats);
    await target.writeFrom('splats', session, 'posed');
    const restored = await target.writeChanged('splats', splats);
    if (restored.counters.upload_bytes !== 4 + 48) throw new Error('Resident copy kept a stale upload baseline');
    await target.step();
    const result = (await target.read({ outputs: ['ellipses'] })).values.ellipses[0];
    if (result.center.join() !== '0,0' || result.rgb !== 255) throw new Error('Restored splat did not reach projection');
    await target.close();
    await session.close();
    await runtime.close();
    const frost = await loadInk(new URL('../build/frost-gpu/', import.meta.url), { device });
    const ice = await frost.pipeline({
      inputs: { colors: [0x11223344, 0x11223344, 0x11223344], timers: [3, 0, -8] },
      steps: [{ id: 'ice', call: 'pack_ice', args: [{ input: 'colors' }, { input: 'timers' }, 128] }],
      outputs: ['ice'],
    }, { backend: 'gpu-required' });
    if (ice.backend !== 'gpu' || Array.from(ice.values.ice).join() !== [0x11ff3344, 0x11803344, 0x11003344].join()) {
      throw new Error('GPU ice packing changed a material channel');
    }
    await frost.close();
    const error = await device.popErrorScope();
    if (error) throw error;
    status.dataset.result = 'passed';
    status.textContent = 'Browser GPU projection, Colored Contours, resident rig uploads, and frost packing passed.';
  }
  check().catch((error) => {
    status.dataset.result = 'failed';
    status.textContent = error.stack || error.message || String(error);
    console.error(error);
  });
</script>
</body>
</html>
